<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.summary %}{{ page.summary | strip_html | strip }}{% else %}{{ site.description | strip }}{% endif %}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
  <meta property="og:description" content="{% if page.summary %}{{ page.summary | strip_html | strip }}{% else %}{{ site.description | strip }}{% endif %}">
  <meta property="og:image" content="{{ site.url }}{% if page.thumb %}{{ page.thumb }}{% else %}/assets/img/headshot-square.jpg{% endif %}">
  <link rel="icon" href="{{ '/assets/img/favicon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  {% include header.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
