<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.summary %}{{ page.summary | strip_html | strip }}{% else %}{{ site.description | strip }}{% endif %}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
  <meta property="og:description" content="{% if page.summary %}{{ page.summary | strip_html | strip }}{% else %}{{ site.description | strip }}{% endif %}">
  <meta property="og:image" content="{{ site.url }}{% if page.thumb %}{{ page.thumb }}{% else %}/assets/img/headshot-square.jpg{% endif %}">
  <link rel="icon" href="{{ '/assets/img/favicon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script>
  // Light mode by default; remember the visitor's choice if they switch.
  try { if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
  </script>
</head>
<body>
  {% include header.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
  <script>
  // Card video previews: play the project's clip while the card is hovered (mouse only)
  (function () {
    if (!window.matchMedia || !matchMedia('(hover: hover)').matches) return;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    document.querySelectorAll('.card').forEach(function (card) {
      var v = card.querySelector('.card-preview');
      if (!v) return;
      card.addEventListener('mouseenter', function () {
        if (!v.src) v.src = v.dataset.src;
        v.currentTime = 0;
        var p = v.play();
        if (p && p.then) p.then(function () { card.classList.add('is-previewing'); }).catch(function () {});
        else card.classList.add('is-previewing');
      });
      card.addEventListener('mouseleave', function () { card.classList.remove('is-previewing'); v.pause(); });
    });
  })();
  </script>
  <script>
  // Light/dark toggle in the header
  (function () {
    var btn = document.querySelector('.theme-toggle');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var dark = document.documentElement.getAttribute('data-theme') !== 'dark';
      if (dark) document.documentElement.setAttribute('data-theme', 'dark');
      else document.documentElement.removeAttribute('data-theme');
      try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
    });
  })();
  </script>
  <script>
  // Clips marked data-autoplay play muted while on screen and pause when scrolled away.
  // If the viewer pauses one with the controls, it stays paused.
  (function () {
    var vids = document.querySelectorAll('video[data-autoplay]');
    if (!vids.length || !('IntersectionObserver' in window)) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    vids.forEach(function (v) {
      v.addEventListener('pause', function () { if (!v._auto) v._userPaused = true; v._auto = false; });
      v.addEventListener('play', function () { v._userPaused = false; });
    });
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        var v = e.target;
        if (e.isIntersecting) { if (!v._userPaused) { var p = v.play(); if (p && p.catch) p.catch(function () {}); } }
        else if (!v.paused) { v._auto = true; v.pause(); }
      });
    }, { threshold: 0.4 });
    vids.forEach(function (v) { io.observe(v); });
  })();
  </script>
  <script>
  // Slideshows: cross-fade every few seconds, pause on hover, dots to jump, click opens full size.
  (function () {
    document.querySelectorAll('.slideshow').forEach(function (box) {
      var slides = box.querySelectorAll('.slide'); if (slides.length < 2) return;
      var i = 0, timer = null, ms = +box.dataset.interval || 3500;
      var label = document.createElement('span'); label.className = 'slide-label'; box.appendChild(label);
      var dots = document.createElement('span'); dots.className = 'slide-dots'; box.appendChild(dots);
      slides.forEach(function (s, k) {
        var b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', 'Show ' + (s.dataset.label || 'slide ' + (k + 1)));
        b.addEventListener('click', function () { show(k); restart(); }); dots.appendChild(b);
      });
      function show(k) {
        i = k; slides.forEach(function (s, n) { s.classList.toggle('is-active', n === k); dots.children[n].setAttribute('aria-current', n === k); });
        label.textContent = slides[k].dataset.label || ''; label.style.display = label.textContent ? '' : 'none';
      }
      function restart() { clearInterval(timer); if (!reduce) timer = setInterval(function () { show((i + 1) % slides.length); }, ms); }
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      box.addEventListener('mouseenter', function () { clearInterval(timer); });
      box.addEventListener('mouseleave', restart);
      show(0); restart();
    });
  })();
  </script>
</body>
</html>
