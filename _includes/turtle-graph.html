<figure class="node-graph">
<svg viewBox="0 0 760 226" role="img" aria-labelledby="tg-title">
  <title id="tg-title">ROS 2 graph: the waypoint node sends velocity commands through the corrupt node, which adds noise before they reach turtlesim; turtlesim's pose feeds back to the waypoint node.</title>
  <defs>
    <marker id="tg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ng-head"/></marker>
  </defs>
  <!-- service calls into waypoint -->
  <text x="115" y="22" class="ng-label" text-anchor="middle">/load · /toggle (services)</text>
  <line x1="115" y1="32" x2="115" y2="78" class="ng-edge" marker-end="url(#tg-arrow)"/>
  <!-- nodes -->
  <rect x="30" y="82" width="170" height="62" rx="10" class="ng-node ng-mine"/>
  <text x="115" y="110" class="ng-name" text-anchor="middle">waypoint</text>
  <text x="115" y="129" class="ng-sub" text-anchor="middle">P controller · 100 Hz</text>
  <rect x="300" y="82" width="160" height="62" rx="10" class="ng-node ng-mine"/>
  <text x="380" y="110" class="ng-name" text-anchor="middle">corrupt</text>
  <text x="380" y="129" class="ng-sub" text-anchor="middle">adds Gaussian noise</text>
  <rect x="564" y="82" width="166" height="62" rx="10" class="ng-node"/>
  <text x="647" y="110" class="ng-name" text-anchor="middle">turtlesim</text>
  <text x="647" y="129" class="ng-sub" text-anchor="middle">simulated robot</text>
  <!-- forward topics -->
  <line x1="200" y1="113" x2="296" y2="113" class="ng-edge" marker-end="url(#tg-arrow)"/>
  <text x="248" y="104" class="ng-topic" text-anchor="middle">pure_cmd_vel</text>
  <line x1="460" y1="113" x2="560" y2="113" class="ng-edge" marker-end="url(#tg-arrow)"/>
  <text x="512" y="104" class="ng-topic" text-anchor="middle">cmd_vel</text>
  <!-- pose feedback -->
  <path d="M647 144 V196 H115 V148" class="ng-edge ng-feedback" marker-end="url(#tg-arrow)"/>
  <text x="380" y="214" class="ng-topic" text-anchor="middle">turtle1/pose (feedback)</text>
</svg>
  <figcaption>Green nodes are mine. The waypoint node also publishes <code>loop_metrics</code> after every lap and calls turtlesim's <code>reset</code>, <code>set_pen</code>, and <code>teleport_absolute</code> services to draw the markers.</figcaption>
</figure>
